name: Check HTB profile integration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check_htb.py
      - .github/workflows/htb-profile-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check selected profile fields
        env:
          HTB_API_TOKEN: ${{ secrets.HTB_API_TOKEN }}
        run: python3 scripts/check_htb.py
